<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Rounded background -->
  <rect width="256" height="256" rx="48" fill="#1E3A5F"/>

  <!-- Presentation screen frame -->
  <rect x="20" y="28" width="216" height="152" rx="14" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.85"/>

  <!-- Slide content lines -->
  <rect x="40" y="52" width="96" height="13" rx="6.5" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="40" y="76" width="136" height="9"  rx="4.5" fill="#FFFFFF" fill-opacity="0.60"/>
  <rect x="40" y="94" width="116" height="9"  rx="4.5" fill="#FFFFFF" fill-opacity="0.60"/>
  <rect x="40" y="112" width="126" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.60"/>
  <rect x="40" y="130" width="90"  height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.60"/>

  <!-- Play / present triangle -->
  <polygon points="162,54 216,100 162,146" fill="#4FC3F7" fill-opacity="0.92"/>

  <!-- Stand -->
  <rect x="120" y="180" width="16" height="34" rx="5" fill="#FFFFFF" fill-opacity="0.70"/>

  <!-- Base -->
  <rect x="82" y="210" width="92" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.70"/>
</svg>
